global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
  - job_name: airflow
    static_configs:
      - targets: [airflow-statsd-exporter:9102]
  - job_name: batch_jobs
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
  - job_name: atmospulse_host_services
    static_configs:
      - targets:
          - host.docker.internal:9108
          - host.docker.internal:9109
          - host.docker.internal:9110
          - host.docker.internal:9111
