apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: BigQuery
    uid: atmospulse-bigquery
    type: grafana-bigquery-datasource
    access: proxy
    editable: false
    jsonData:
      authenticationType: gce
      defaultProject: ${ATMOSPULSE_BQ_PROJECT}
      processingLocation: ${ATMOSPULSE_BQ_LOCATION}
      MaxBytesBilled: 1073741824
      restrictToAccessibleDatasets: true
