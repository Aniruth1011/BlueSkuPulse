name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --frozen --dev
      - run: docker compose up -d --wait redpanda topic-init
      - run: uv run pytest tests/integration tests/reliability
      - if: always()
        run: docker compose down --volumes

  publish:
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ingestion, bronze, spark, warehouse]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atmospulse-${{ matrix.target }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/atmospulse-${{ matrix.target }}:${{ github.sha }}
          provenance: true
          sbom: true

